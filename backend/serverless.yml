service: venue-control-gabriel-galan
frameworkVersion: ~4.45.0
provider:
  name: aws
  runtime: nodejs22.x
  region: us-west-2
  stage: dev
  iam:
    role: arn:aws:iam::793629871707:role/LabRole
plugins:
  - serverless-offline
custom:
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3003
functions:
  zones:
    handler: dist/zones.handler
    events:
      - http:
          path: zones
          method: get
          cors: true
      - http:
          path: zones/{id}
          method: get
          cors: true
      - http:
          path: zones
          method: post
          cors: true
      - http:
          path: zones/{id}
          method: put
          cors: true
      - http:
          path: zones/{id}
          method: patch
          cors: true
      - http:
          path: zones/{id}
          method: delete
          cors: true
